name: "Set up Node + @kalystrum registry"
description: >
    Checks out the repo, installs Node with the @kalystrum GitHub Packages
    registry configured, and runs npm ci against it. Shared by every
    workflow that needs a working checkout before running an npm script.
inputs:
    node-version:
        description: "Node version to install"
        required: false
        default: "22"
runs:
    using: "composite"
    steps:
        - uses: actions/checkout@v4
          with:
              set-safe-directory: false

        - uses: actions/setup-node@v4
          with:
              node-version: ${{ inputs.node-version }}
              registry-url: https://npm.pkg.github.com
              scope: "@kalystrum"

        - name: npm ci
          shell: bash
          run: npm ci
          env:
              NODE_AUTH_TOKEN: ${{ github.token }}
