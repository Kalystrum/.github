name: status-checks

on:
    pull_request:
        branches: [develop, production, release/**]
    push:
        branches: [production, develop]
    workflow_call:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # ===== SELF-HOSTED RUNNERS (Primary) =====
    lint-local:
        name: Lint (Local)
        runs-on: [self-hosted]
        timeout-minutes: 30
        continue-on-error: true
        outputs:
            success: ${{ job.status == 'success' }}
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: recursive
                  token: ${{ secrets.KALYSTRUM_WORKFLOW_TOKEN || github.token }}

            - name: Detect Node project
              id: detect
              run: echo "exists=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

            - uses: actions/setup-node@v4
              if: steps.detect.outputs.exists == 'true'
              with:
                  node-version: 22

            - run: npm ci
              if: steps.detect.outputs.exists == 'true'

            - run: npm run lint --if-present
              if: steps.detect.outputs.exists == 'true'

            - name: ⏱️ Job timeout check
              if: always()
              run: |
                  if [ "${{ job.status }}" = "cancelled" ]; then
                    echo "❌ Job was cancelled due to timeout (30 minutes exceeded)"
                    exit 1
                  fi

    format-local:
        name: Format (Local)
        runs-on: [self-hosted]
        timeout-minutes: 30
        continue-on-error: true
        outputs:
            success: ${{ job.status == 'success' }}
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: recursive
                  token: ${{ secrets.KALYSTRUM_WORKFLOW_TOKEN || github.token }}

            - name: Detect Node project
              id: detect
              run: echo "exists=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

            - uses: actions/setup-node@v4
              if: steps.detect.outputs.exists == 'true'
              with:
                  node-version: 22

            - run: npm ci
              if: steps.detect.outputs.exists == 'true'

            - run: npm run format-check --if-present
              if: steps.detect.outputs.exists == 'true'

            - name: ⏱️ Job timeout check
              if: always()
              run: |
                  if [ "${{ job.status }}" = "cancelled" ]; then
                    echo "❌ Job was cancelled due to timeout (30 minutes exceeded)"
                    exit 1
                  fi

    types-local:
        name: Types (Local)
        runs-on: [self-hosted]
        timeout-minutes: 30
        continue-on-error: true
        outputs:
            success: ${{ job.status == 'success' }}
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: recursive
                  token: ${{ secrets.KALYSTRUM_WORKFLOW_TOKEN || github.token }}

            - name: Detect Node project
              id: detect
              run: echo "exists=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

            - uses: actions/setup-node@v4
              if: steps.detect.outputs.exists == 'true'
              with:
                  node-version: 22

            - run: npm ci
              if: steps.detect.outputs.exists == 'true'

            - run: npm run typecheck --if-present
              if: steps.detect.outputs.exists == 'true'

            - name: ⏱️ Job timeout check
              if: always()
              run: |
                  if [ "${{ job.status }}" = "cancelled" ]; then
                    echo "❌ Job was cancelled due to timeout (30 minutes exceeded)"
                    exit 1
                  fi

    tests-local:
        name: Tests (Local)
        runs-on: [self-hosted]
        timeout-minutes: 30
        continue-on-error: true
        outputs:
            success: ${{ job.status == 'success' }}
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: recursive
                  token: ${{ secrets.KALYSTRUM_WORKFLOW_TOKEN || github.token }}

            - name: Detect Node project
              id: detect
              run: echo "exists=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

            - uses: actions/setup-node@v4
              if: steps.detect.outputs.exists == 'true'
              with:
                  node-version: 22

            - run: npm ci
              if: steps.detect.outputs.exists == 'true'

            - run: npm run test --if-present
              if: steps.detect.outputs.exists == 'true'

            - run: npm run test:coverage --if-present
              if: steps.detect.outputs.exists == 'true'

            - uses: actions/upload-artifact@v4
              if: steps.detect.outputs.exists == 'true' && hashFiles('coverage/**') != ''
              with:
                  name: coverage-report
                  path: coverage
                  if-no-files-found: ignore

            - name: ⏱️ Job timeout check
              if: always()
              run: |
                  if [ "${{ job.status }}" = "cancelled" ]; then
                    echo "❌ Job was cancelled due to timeout (30 minutes exceeded)"
                    exit 1
                  fi

    # ===== GITHUB-HOSTED FALLBACK (Backup) =====
    lint-github:
        name: Lint (GitHub)
        needs: lint-local
        if: ${{ needs.lint-local.outputs.success != 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: recursive
                  token: ${{ secrets.KALYSTRUM_WORKFLOW_TOKEN || github.token }}

            - name: Detect Node project
              id: detect
              run: echo "exists=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

            - uses: actions/setup-node@v4
              if: steps.detect.outputs.exists == 'true'
              with:
                  node-version: 22

            - run: npm ci
              if: steps.detect.outputs.exists == 'true'

            - run: npm run lint --if-present
              if: steps.detect.outputs.exists == 'true'

            - name: ✅ Fallback lint succeeded
              run: echo "Lint passed on GitHub runner (self-hosted was unavailable)"

            - name: ⏱️ Job timeout check
              if: always()
              run: |
                  if [ "${{ job.status }}" = "cancelled" ]; then
                    echo "❌ Job was cancelled due to timeout (30 minutes exceeded)"
                    exit 1
                  fi

    format-github:
        name: Format (GitHub)
        needs: format-local
        if: ${{ needs.format-local.outputs.success != 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: recursive
                  token: ${{ secrets.KALYSTRUM_WORKFLOW_TOKEN || github.token }}

            - name: Detect Node project
              id: detect
              run: echo "exists=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

            - uses: actions/setup-node@v4
              if: steps.detect.outputs.exists == 'true'
              with:
                  node-version: 22

            - run: npm ci
              if: steps.detect.outputs.exists == 'true'

            - run: npm run format-check --if-present
              if: steps.detect.outputs.exists == 'true'

            - name: ✅ Fallback format check succeeded
              run: echo "Format check passed on GitHub runner (self-hosted was unavailable)"

            - name: ⏱️ Job timeout check
              if: always()
              run: |
                  if [ "${{ job.status }}" = "cancelled" ]; then
                    echo "❌ Job was cancelled due to timeout (30 minutes exceeded)"
                    exit 1
                  fi

    types-github:
        name: Types (GitHub)
        needs: types-local
        if: ${{ needs.types-local.outputs.success != 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: recursive
                  token: ${{ secrets.KALYSTRUM_WORKFLOW_TOKEN || github.token }}

            - name: Detect Node project
              id: detect
              run: echo "exists=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

            - uses: actions/setup-node@v4
              if: steps.detect.outputs.exists == 'true'
              with:
                  node-version: 22

            - run: npm ci
              if: steps.detect.outputs.exists == 'true'

            - run: npm run typecheck --if-present
              if: steps.detect.outputs.exists == 'true'

            - name: ✅ Fallback typecheck succeeded
              run: echo "Typecheck passed on GitHub runner (self-hosted was unavailable)"

            - name: ⏱️ Job timeout check
              if: always()
              run: |
                  if [ "${{ job.status }}" = "cancelled" ]; then
                    echo "❌ Job was cancelled due to timeout (30 minutes exceeded)"
                    exit 1
                  fi

    tests-github:
        name: Tests (GitHub)
        needs: tests-local
        if: ${{ needs.tests-local.outputs.success != 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: recursive
                  token: ${{ secrets.KALYSTRUM_WORKFLOW_TOKEN || github.token }}

            - name: Detect Node project
              id: detect
              run: echo "exists=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

            - uses: actions/setup-node@v4
              if: steps.detect.outputs.exists == 'true'
              with:
                  node-version: 22

            - run: npm ci
              if: steps.detect.outputs.exists == 'true'

            - run: npm run test --if-present
              if: steps.detect.outputs.exists == 'true'

            - run: npm run test:coverage --if-present
              if: steps.detect.outputs.exists == 'true'

            - uses: actions/upload-artifact@v4
              if: steps.detect.outputs.exists == 'true' && hashFiles('coverage/**') != ''
              with:
                  name: coverage-report
                  path: coverage
                  if-no-files-found: ignore

            - name: ✅ Fallback tests succeeded
              run: echo "Tests passed on GitHub runner (self-hosted was unavailable)"

            - name: ⏱️ Job timeout check
              if: always()
              run: |
                  if [ "${{ job.status }}" = "cancelled" ]; then
                    echo "❌ Job was cancelled due to timeout (30 minutes exceeded)"
                    exit 1
                  fi

    # ===== FINAL BUILD (After All Checks) =====
    build:
        name: Build
        needs:
            [
                lint-local,
                format-local,
                types-local,
                tests-local,
                lint-github,
                format-github,
                types-github,
                tests-github,
            ]
        if: ${{ !failure() }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment:
            name: ${{ github.ref == 'refs/heads/production' && 'production' || 'development' }}
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: recursive
                  token: ${{ secrets.KALYSTRUM_WORKFLOW_TOKEN || github.token }}

            - name: Detect Node project
              id: detect
              run: echo "exists=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

            - uses: actions/setup-node@v4
              if: steps.detect.outputs.exists == 'true'
              with:
                  node-version: 22

            - run: npm ci
              if: steps.detect.outputs.exists == 'true'

            - run: npm rebuild
              if: steps.detect.outputs.exists == 'true'

            - run: npm run build --if-present
              if: steps.detect.outputs.exists == 'true'

            - name: ✅ Build succeeded
              run: echo "Build completed successfully!"

            - name: ⏱️ Job timeout check
              if: always()
              run: |
                  if [ "${{ job.status }}" = "cancelled" ]; then
                    echo "❌ Job was cancelled due to timeout (30 minutes exceeded)"
                    exit 1
                  fi
