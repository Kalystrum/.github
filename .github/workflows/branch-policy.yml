name: branch-policy

on:
    pull_request:
        branches: [production]
    workflow_call:

concurrency:
    group: branch-policy-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # ===== SELF-HOSTED RUNNER (Primary) =====
    production-source-local:
        name: Branch policy (Local)
        runs-on: [self-hosted, macos]
        continue-on-error: true
        outputs:
            success: ${{ job.status == 'success' }}
        steps:
            - name: Ensure production only receives develop or release branches
              env:
                  HEAD_REF: ${{ github.head_ref }}
              run: |
                  if [[ "$HEAD_REF" == "develop" || "$HEAD_REF" == release/* ]]; then
                      echo "✅ Branch policy passed ($HEAD_REF -> production)."
                  else
                      echo "❌ Pull requests into production must come from 'develop' or a 'release/*' branch."
                      echo "Open your pull request against develop first, then merge develop (or a release branch) into production."
                      exit 1
                  fi

    # ===== GITHUB-HOSTED FALLBACK (Backup) =====
    production-source-github:
        name: Branch policy (GitHub)
        needs: production-source-local
        if: ${{ needs.production-source-local.outputs.success != 'true' }}
        runs-on: ubuntu-latest
        steps:
            - name: Ensure production only receives develop or release branches
              env:
                  HEAD_REF: ${{ github.head_ref }}
              run: |
                  if [[ "$HEAD_REF" == "develop" || "$HEAD_REF" == release/* ]]; then
                      echo "✅ Branch policy passed ($HEAD_REF -> production) [Fallback]"
                  else
                      echo "❌ Pull requests into production must come from 'develop' or a 'release/*' branch."
                      echo "Open your pull request against develop first, then merge develop (or a release branch) into production."
                      exit 1
                  fi
